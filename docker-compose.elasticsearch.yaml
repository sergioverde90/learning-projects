services:
  es:
    container_name: es
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    environment:
      - node.name=es
      - cluster.name=docker-cluster
      - cluster.initial_master_nodes=es,es2
      - discovery.seed_hosts=es2
      - ingest.geoip.downloader.enabled=false
      - action.destructive_requires_name=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      # --- HOTSPOTTING TRAINING: tiny disk simulation ---
      # threshold_enabled + low/high/flood_stage with absolute byte values
      # makes ES think disk is full very quickly (~1GB total).
      # check interval 1s for fast feedback while training
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=700mb
      - cluster.routing.allocation.disk.watermark.high=500mb
      - cluster.routing.allocation.disk.watermark.flood_stage=300mb
      - cluster.routing.allocation.disk.watermark.flood_stage.frozen=300mb
      - cluster.info.update.interval=1s
    ports:
      - "9200:9200"
    networks:
      - docker-network
    # tmpfs caps the filesystem ES sees to 1G -> real small disk, ideal for laptop
    tmpfs:
      - /usr/share/elasticsearch/data:size=1G,uid=1000,gid=1000,mode=0755
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  es2:
    container_name: es2
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    environment:
      - node.name=es2
      - cluster.name=docker-cluster
      - cluster.initial_master_nodes=es,es2
      - discovery.seed_hosts=es
      - ingest.geoip.downloader.enabled=false
      - action.destructive_requires_name=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      # --- HOTSPOTTING TRAINING: intentionally smaller than es (750M vs 1G) ---
      # uneven capacity makes shard-balance hotspotting trivial to trigger:
      # es2 hits high/flood_stage first -> shards pile on es -> hot node
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=500mb
      - cluster.routing.allocation.disk.watermark.high=300mb
      - cluster.routing.allocation.disk.watermark.flood_stage=150mb
      - cluster.routing.allocation.disk.watermark.flood_stage.frozen=150mb
      - cluster.info.update.interval=1s
    ports:
      - "9201:9200"
    networks:
      - docker-network
    # 750M tmpfs = visibly less headroom than es, forces imbalance
    tmpfs:
      - /usr/share/elasticsearch/data:size=750M,uid=1000,gid=1000,mode=0755
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    ports:
      - "5601:5601"
    environment:
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.authc.http.enabled=false
      - xpack.security.authc.http.autoSchemesEnabled=false
      - xpack.security.authc.selector.enabled=false
      - elasticsearc.ssl.verificationMode=none
      - elasticsearc.ssl.alwaysPresentCertificate=false
      - elasticsearch.hosts=['http://es:9200']
    networks:
      - docker-network
    depends_on:
      - es

networks:
  docker-network:
