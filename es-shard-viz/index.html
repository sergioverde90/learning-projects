<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ES Shard Balance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Elasticsearch shard balance</h1>
      <span id="health" class="pill unknown">health: …</span>
    </div>
    <div class="toolbar">
      <label>Refresh
        <select id="interval">
          <option value="0">off</option>
          <option value="2000">2s</option>
          <option value="5000" selected>5s</option>
          <option value="15000">15s</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="hideSystem" checked /> hide system indices (.*)</label>
      <label>Filter <input id="filter" type="search" placeholder="index substring…" /></label>
      <label class="check"><input type="checkbox" id="onlyAssigned" /> hide unassigned</label>
      <label title="Shards at or above this size render full red. Default 40GB follows the recommended 20–40GB shard size.">Red at <input id="redAt" type="number" min="1" value="40" /> GB</label>
      <label title="Basic-auth user for Elasticsearch (sent to the same-origin proxy, which forwards it to ES)">ES user <input id="esUser" type="text" placeholder="elastic" autocomplete="username" /></label>
      <label>Pass <input id="esPass" type="password" placeholder="••••••" autocomplete="current-password" /></label>
      <button id="reload">↻ Reload now</button>
      <span id="updated" class="muted"></span>
    </div>
    <div class="legend-row">
      <span class="muted">light blue = tiny → red = oversized (≥ red-at)</span>
      <span id="scale" class="muted"></span>
      <span class="spacer"></span>
      <span class="badge p">p primary</span>
      <span class="badge r">r replica</span>
    </div>
    <div id="error" class="error" hidden></div>
  </header>

  <main id="nodes" class="nodes"></main>

  <footer class="muted">
    Sources: <code>_cat/nodes?format=json</code> · <code>_cat/shards?format=json</code> ·
    <code>_cat/indices?format=json</code> · <code>_cluster/health</code> — via <code>/api/es/*</code> proxy.
  </footer>

  <script src="app.js"></script>
</body>
</html>
